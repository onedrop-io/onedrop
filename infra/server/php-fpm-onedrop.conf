; Runs the app as the onedrop user (in the docker group) so web requests can talk to Docker.
[onedrop]
user = onedrop
group = onedrop
listen = /run/php/php8.4-fpm-onedrop.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
