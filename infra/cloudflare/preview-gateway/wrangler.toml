# OneDrop preview gateway (GW-002). Deploy: see docs/self-hosting/cloudflare-preview-gateway.mdx.
name = "onedrop-preview-gateway"
main = "worker.js"
compatibility_date = "2026-09-01"

# Every name under the wildcard reaches the Worker; it only handles preview-<id>, shell-<id> and published apps.
# The catch-all route also brings it custom domains (Cloudflare for SaaS custom hostnames, DOM-001).
# relay.onedrop.dev (the device relay, DESK-010) is under the wildcard too. Sandboxes are served from onedrop.dev, not
# the app's onedrop.io, so code in them is on another site (GW-002); *.onedrop.io stays routed only to move old
# addresses there (FORMER_GATEWAY_DOMAIN), and the app's other names under it pass straight through.
routes = [
    { pattern = "*.onedrop.dev/*", zone_name = "onedrop.dev" },
    # Custom domains (DOM-001): add back once Cloudflare for SaaS is on for onedrop.dev. Until then Cloudflare refuses
    # it, and with it every route in this list.
    # { pattern = "*/*", zone_name = "onedrop.dev" },
    { pattern = "*.onedrop.io/*", zone_name = "onedrop.io" },
]

# The device relay: one Durable Object per computer that the desktop app keeps a WebSocket open to (DESK-010).
[[durable_objects.bindings]]
name = "DEVICE_RELAY"
class_name = "DeviceRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceRelay"]

# Request logs in the dashboard (Workers → onedrop-preview-gateway → Logs), to see which addresses use the quota.
[observability]
enabled = true

[vars]
APP_URL = "https://onedrop.io"
GATEWAY_DOMAIN = "onedrop.dev"
FORMER_GATEWAY_DOMAIN = "onedrop.io"

# Secret, set with: npx wrangler secret put GATEWAY_SECRET  (the app's SANDBOX_GATEWAY_SECRET)
