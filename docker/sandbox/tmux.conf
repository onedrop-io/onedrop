# tmux behind the Shell tab (see shell-entry; LAYOUT-005). It's only there so a session outlives the page:
# no status bar, no prefix key, and the browser terminal keeps its own scrollback and text selection.
set -g status off
set -g prefix None
unbind-key C-b
set -g mouse off
set -g escape-time 10
set -g history-limit 10000
set -g default-terminal screen-256color
set -ga terminal-overrides ',xterm*:smcup@:rmcup@,xterm-256color:RGB'
set -g set-titles off
set -g focus-events on
set -g destroy-unattached off

# A session no tab comes back to (closed, not reloaded) ends a few minutes later.
set-hook -g client-detached 'run-shell -b "/opt/onedrop/shell-reap #{q:session_name}"'
