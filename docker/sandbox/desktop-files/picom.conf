# The desktop's compositor (CMP-001): rounded windows with soft shadows, and a translucent dock. No fading or blur:
# every frame drawn is sent to the viewer.
backend = "xrender";
vsync = false;
fading = false;

corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "class_g = 'Plank'"
];

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.45;
shadow-offset-x = -20;
shadow-offset-y = -14;
shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "class_g = 'Plank'",
    "_GTK_FRAME_EXTENTS@:c"
];
