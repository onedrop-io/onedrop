name: e2b image

# Rebuilds the E2B sandbox template (what `php artisan sandbox:build-image` does with SANDBOX_PROVIDER=e2b) once the
# `images` workflow has published a new ghcr.io/onedrop-io/onedrop-sandbox:latest from main: E2B builds its template
# from that image (infra/e2b/build.mjs). Sandboxes get changed tool files copied in without it; a changed base
# (Dockerfile, start.sh, dockerd, shell-keys.js) moves each to a new sandbox from the new build once its project sits
# unused (SBX-002). Needs the E2B_API_KEY secret; E2B_TEMPLATE (a repository variable) defaults to onedrop-sandbox.

on:
  workflow_run:
    workflows: [images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2b-image
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE || 'onedrop-sandbox' }}
    steps:
      - name: Skip without an E2B key
        if: env.E2B_API_KEY == ''
        run: echo "::notice::E2B_API_KEY isn't set; not building the E2B template."

      - name: Checkout code
        if: env.E2B_API_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: env.E2B_API_KEY != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build the sandbox template on E2B
        if: env.E2B_API_KEY != ''
        working-directory: infra/e2b
        run: |
          npm ci
          node build.mjs
